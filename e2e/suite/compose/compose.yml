# The suite end-to-end topology (docs/superpowers/specs/2026-11-24-multi-tenant-e2e-design.md,
# Topology). The driver (e2e/suite/smoke_test.go) sets every ${...}; only the driver's loopback
# ports are published. dockerd starts these outside any kslot scope, so each has its own memory
# limit, and the driver refuses a service without one or a total over 5 GiB. S3, CoreDNS and
# KyRecovery join with the scenarios that need them.
name: ${E2E_PROJECT:?}

x-kycalendar: &kycalendar
  image: ${KYCALENDAR_IMAGE:?}
  mem_limit: 512m
  memswap_limit: 512m
  restart: "no"
  depends_on:
    postgres: { condition: service_healthy }
  secrets: [s3_secret, e2e_ca, meeting_pair]
  environment: &kycalendar-env
    KYCALENDAR_TENANCY: multi
    PUSH_RELAY_URL: ""
    APNS_RELAY_URL: ""
    KY_ENV: production
    KY_DB_DRIVER: postgres
    KY_SESSION_SECRET: ${E2E_SESSION_SECRET:?}
    KY_ENCRYPTION_KEY: ${E2E_ENCRYPTION_KEY:?}
    KY_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:?}
    KYCALENDAR_SCHEDULING: "true"
    KY_KYSIGNON_ISSUER: https://id.e2e.test
    KY_KYSIGNON_CLIENT_ID: kycalendar
    KY_KYSIGNON_SECRET: ${E2E_KYCALENDAR_CLIENT_SECRET:-}
    SSL_CERT_FILE: /run/secrets/e2e_ca
    KYCALENDAR_S3_ENDPOINT: https://s3.e2e.test
    KYCALENDAR_S3_BUCKET: kycalendar
    KYCALENDAR_S3_ACCESS_KEY: e2e
    KYCALENDAR_S3_SECRET_KEY_FILE: /run/secrets/s3_secret
    KYCALENDAR_STAFF_ORG_ID: ${E2E_STAFF_ORG_ID:?}
    # Contract B: KyCalendar and KyMessages are paired explicitly with one per-run secret
    # (KyMessages #58). messages.e2e.test is front's network address, a private one.
    KYCALENDAR_KYMESSAGES_URL: https://messages.e2e.test
    KYCALENDAR_KYMESSAGES_SECRET_FILE: /run/secrets/meeting_pair
    KYCALENDAR_KYMESSAGES_ALLOW_PRIVATE: "true"
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
    interval: 2s
    retries: 60

services:
  postgres:
    image: postgres:18.7-trixie@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
    mem_limit: 1g
    memswap_limit: 1g
    shm_size: 256m
    environment:
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:?}
    volumes:
      - ./initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    # TLS from the run's CA and bounded dead connections: KyPost's table mode requires both
    # (sslmode=verify-full; its docs/RUNNING.md keepalive values). Other apps still connect without.
    secrets: [tls_cert, tls_key]
    entrypoint: ["sh", "-c", "install -o postgres -g postgres -m 600 /run/secrets/tls_cert /run/secrets/tls_key /var/lib/postgresql/ && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/tls_cert -c ssl_key_file=/var/lib/postgresql/tls_key -c tcp_keepalives_idle=10 -c tcp_keepalives_interval=5 -c tcp_keepalives_count=4 -c tcp_user_timeout=30000"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 1s
      retries: 60

  # Cell e2e-1: two replicas on one database (D2).
  kycalendar-x1: &kycalendar-x
    <<: *kycalendar
    environment:
      <<: *kycalendar-env
      KY_APP_URL: https://cal-x.e2e.test
      KY_DB_DSN: postgres://postgres:${E2E_POSTGRES_PASSWORD}@postgres:5432/kycal_x?sslmode=disable
      KY_CELLS: e2e-1
  kycalendar-x2: *kycalendar-x

  # Cell e2e-2 on its own database.
  kycalendar-y:
    <<: *kycalendar
    environment:
      <<: *kycalendar-env
      KY_APP_URL: https://cal-y.e2e.test
      KY_DB_DSN: postgres://postgres:${E2E_POSTGRES_PASSWORD}@postgres:5432/kycal_y?sslmode=disable
      KY_CELLS: e2e-2

  # The release image at the same commit, with X's configuration: it must refuse to start.
  kycalendar-release:
    <<: *kycalendar-x
    image: ${KYCALENDAR_RELEASE_IMAGE:?}
    mem_limit: 256m
    memswap_limit: 256m
    profiles: [release]

  # The issuer for every cell. Its platform API listens on its own port, inside the network only.
  kyidentity: &kyidentity
    image: ${KYIDENTITY_IMAGE:?}
    mem_limit: 512m
    memswap_limit: 512m
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    # Compose mounts secrets root-owned and world-readable; KyIdentity wants its keys private.
    secrets: [kyidentity_rsa, kyidentity_vapid, e2e_ca]
    entrypoint: ["sh", "-c", "install -m 600 /run/secrets/kyidentity_rsa /run/secrets/kyidentity_vapid /data/ && exec kyidentity \"$$@\"", "--"]
    environment:
      KYIDENTITY_TENANCY: multi
      PUSH_RELAY_URL: ""
      APNS_RELAY_URL: ""
      KYIDENTITY_REPLICATED: "true"
      KYIDENTITY_ISSUER_URL: https://id.e2e.test
      KYIDENTITY_DATABASE_URL: postgres://postgres:${E2E_POSTGRES_PASSWORD}@postgres:5432/kyidentity?sslmode=disable
      KYIDENTITY_SECRET_KEY: ${E2E_KYIDENTITY_SECRET_KEY:?}
      KYIDENTITY_ENCRYPTION_KEY: ${E2E_ENCRYPTION_KEY:?}
      KYIDENTITY_RSA_KEY_PATH: /data/kyidentity_rsa
      KYIDENTITY_VAPID_KEY_PATH: /data/kyidentity_vapid
      KYIDENTITY_PLATFORM_LISTEN: 0.0.0.0:5868
      BOOTSTRAP_ADMIN_PASS: ${E2E_ADMIN_PASSWORD:?}
      KYIDENTITY_ALLOW_PRIVATE_CALLBACKS: "true"
      SSL_CERT_FILE: /run/secrets/e2e_ca # the mail sink's and post.e2e.test's certificate
    # The platform API is internal; the driver calls it as billing would, on a loopback port.
    ports: ["127.0.0.1::5868"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5867/readyz"]
      interval: 2s
      retries: 60

  kyidentity-release:
    <<: *kyidentity
    image: ${KYIDENTITY_RELEASE_IMAGE:?}
    ports: !reset []
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [release]

  # TLS for the .test names, from the run's own CA (the driver makes both, per run).
  front:
    image: caddy:2.11-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    mem_limit: 64m
    memswap_limit: 64m
    restart: "no"
    depends_on:
      kyidentity: { condition: service_healthy }
    secrets: [tls_cert, tls_key, e2e_ca]
    configs:
      - { source: caddyfile, target: /etc/caddy/Caddyfile }
    # The driver's browser: every *.e2e.test name through one loopback port.
    ports: ["127.0.0.1::443"]
    networks:
      default:
        aliases: [id.e2e.test, cal-x.e2e.test, cal-y.e2e.test, messages.e2e.test, post.e2e.test]

  # The mail sink KyIdentity's invitations go to (STARTTLS, the run's certificate). Its API is
  # how the driver reads activation links and proves that no mail went out.
  mail:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    mem_limit: 64m
    memswap_limit: 64m
    restart: "no"
    secrets: [tls_cert, tls_key]
    environment:
      MP_SMTP_TLS_CERT: /run/secrets/tls_cert
      MP_SMTP_TLS_KEY: /run/secrets/tls_key
      MP_SMTP_REQUIRE_STARTTLS: "true"
    ports: ["127.0.0.1::8025"]
    networks:
      default:
        aliases: [smtp.e2e.test]

  # One deployment serving both cells (C2).
  kymessages: &kymessages
    image: ${KYMESSAGES_IMAGE:?}
    mem_limit: 512m
    memswap_limit: 512m
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      front: { condition: service_started }
    secrets: [kymessages_seal, e2e_ca, meeting_pair]
    entrypoint: ["sh", "-c", "install -m 600 /run/secrets/kymessages_seal /app/data/ && exec /app/kymessages \"$$@\"", "--"]
    environment:
      KY_TENANCY_MODE: multi
      PUSH_RELAY_URL: ""
      APNS_RELAY_URL: ""
      KY_CELLS: e2e-1,e2e-2
      KY_STAFF_ORG_ID: ${E2E_STAFF_ORG_ID:?}
      KY_DB_DRIVER: postgres
      KY_DB_DSN: postgres://postgres:${E2E_POSTGRES_PASSWORD}@postgres:5432/kymessages?sslmode=disable
      KY_SESSION_SECRET: ${E2E_SESSION_SECRET:?}
      KY_ENCRYPTION_KEY: ${E2E_ENCRYPTION_KEY:?}
      KY_PUSH_ENABLED: "false"
      KY_APP_URL: https://messages.e2e.test
      KY_KYIDENTITY_ISSUER: https://id.e2e.test
      KY_KYIDENTITY_CLIENT_ID: kymessages
      KY_KYIDENTITY_SECRET: ${E2E_KYMESSAGES_CLIENT_SECRET:-}
      # The same pair secret as KyCalendar's (contract B); KY_MEETING_SYNC_SECRET stays unset.
      KY_KYCALENDAR_URL: https://cal-x.e2e.test
      KY_KYCALENDAR_SECRET_FILE: /run/secrets/meeting_pair
      SSL_CERT_FILE: /run/secrets/e2e_ca
      KY_ATTACHMENTS_S3_ENDPOINT: https://s3.e2e.test
      KY_ATTACHMENTS_S3_REGION: e2e
      KY_ATTACHMENTS_S3_BUCKET: kymessages
      KY_ATTACHMENTS_S3_ACCESS_KEY: e2e
      KY_ATTACHMENTS_S3_SECRET: ${E2E_S3_SECRET:?}
      KY_ATTACHMENTS_S3_SEAL_KEY_FILE: /app/data/kymessages_seal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/settings"]
      interval: 2s
      retries: 60

  kymessages-release:
    <<: *kymessages
    image: ${KYMESSAGES_RELEASE_IMAGE:?}
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [release]

  # One deployment serving both cells (e2e-1, e2e-2) in table mode; native mail stays off until
  # CoreDNS provides TXT/MX domain verification. SSO settings live in kypost_volumes.documents.
  kypost: &kypost
    image: ${KYPOST_IMAGE:?}
    mem_limit: 384m
    memswap_limit: 384m
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      front: { condition: service_started }
    secrets: [kypost_keys, kypost_vapid, tls_cert, tls_key, e2e_ca]
    # Secrets arrive root-owned and world-readable; KyPost wants its files private and its own.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        p=/kypost/private
        while read -r name value; do printf %s "$$value" > "$$p/$$name"; done < /run/secrets/kypost_keys
        cp /run/secrets/kypost_vapid "$$p/notifications-vapid-private.pem"
        cp /run/secrets/tls_cert "$$p/tls.crt"; cp /run/secrets/tls_key "$$p/tls.key"; cp /run/secrets/e2e_ca "$$p/e2e-ca.pem"
        chown -R 1000:1000 /kypost; chmod 600 "$$p"/*
        exec setpriv --reuid=1000 --regid=1000 --init-groups /usr/local/bin/kypost-server --mode server
      - --
    environment:
      KYPOST_TENANCY: multi
      KYPOST_STAFF_ORG_ID: ${E2E_STAFF_ORG_ID:?}
      KY_CELLS: e2e-1,e2e-2
      KYPOST_NATIVE_MAIL: "false"
      KYPOST_DISABLE_AI_SORTING: "true"
      KYPOST_DATABASE_URL: postgres://postgres:${E2E_POSTGRES_PASSWORD}@postgres:5432/kypost?sslmode=verify-full&sslrootcert=/kypost/private/e2e-ca.pem
      SERVER_BASE_URL: https://post.e2e.test
      TLS_CERT_FILE: /kypost/private/tls.crt
      TLS_KEY_FILE: /kypost/private/tls.key
      SSL_CERT_FILE: /kypost/private/e2e-ca.pem
      PAIRING_SECRET: ${E2E_KYPOST_PAIRING_SECRET:-}
      PUSH_RELAY_URL: ""
      APNS_RELAY_URL: ""
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/kypost/private/e2e-ca.pem", "https://kypost:5866/readyz"]
      interval: 2s
      retries: 60

  # KyPost's release image at the same commit, with the same settings: it must refuse at the gate.
  kypost-release:
    <<: *kypost
    image: ${KYPOST_RELEASE_IMAGE:?}
    mem_limit: 128m
    memswap_limit: 128m
    profiles: [release]

configs:
  caddyfile:
    content: |
      {
        admin off
        auto_https disable_redirects
      }
      (cert) {
        tls /run/secrets/tls_cert /run/secrets/tls_key
      }
      https://id.e2e.test {
        import cert
        reverse_proxy kyidentity:5867
      }
      https://cal-x.e2e.test {
        import cert
        reverse_proxy kycalendar-x1:8080 kycalendar-x2:8080 {
          # The pinned KyCalendar signs OIDC nonce cookies with a process-local key.
          lb_policy cookie kye2e_replica
        }
      }
      https://cal-y.e2e.test {
        import cert
        reverse_proxy kycalendar-y:8080
      }
      https://messages.e2e.test {
        import cert
        reverse_proxy kymessages:8080
      }
      https://post.e2e.test {
        import cert
        reverse_proxy https://kypost:5866 {
          transport http {
            tls_trusted_ca_certs /run/secrets/e2e_ca
          }
        }
      }

secrets:
  tls_cert:
    environment: E2E_TLS_CERT
  tls_key:
    environment: E2E_TLS_KEY
  e2e_ca:
    environment: E2E_CA
  s3_secret:
    environment: E2E_S3_SECRET
  kyidentity_rsa:
    environment: E2E_KYIDENTITY_RSA
  kyidentity_vapid:
    environment: E2E_KYIDENTITY_VAPID
  meeting_pair:
    environment: E2E_MEETING_PAIR
  kypost_keys:
    environment: E2E_KYPOST_KEYS
  kypost_vapid:
    environment: E2E_KYPOST_VAPID
  kymessages_seal:
    environment: E2E_KYMESSAGES_SEAL
