[book]
title = "KyCalendar Manual"
authors = ["Busnes.app"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/Busnes-app/KyCalendar"
edit-url-template = "https://github.com/Busnes-app/KyCalendar/edit/main/docs/{path}"

[output.html.search]
enable = true

[output.html.print]
enable = true
